<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redirecting...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0f0800; min-height: 100vh; }
    .blob { position:fixed;border-radius:50%;filter:blur(90px);opacity:.18;animation:float 8s ease-in-out infinite;pointer-events:none; }
    .blob-1 { width:400px;height:400px;background:#f97316;top:-80px;left:-80px; }
    .blob-2 { width:350px;height:350px;background:#ec4899;bottom:-80px;right:-80px;animation-delay:4s; }
    @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-20px)} }

    .ring-bg   { stroke:rgba(255,255,255,0.08); }
    .ring-fill {
      stroke:#f97316; stroke-linecap:round;
      transform:rotate(-90deg); transform-origin:50% 50%;
      transition:stroke-dashoffset .9s linear;
      filter:drop-shadow(0 0 8px rgba(249,115,22,0.6));
    }

    @keyframes numPop { 0%{transform:scale(1.4);opacity:.5} 100%{transform:scale(1);opacity:1} }
    .num-pop { animation:numPop .4s ease-out; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation:fadeUp .6s ease both; }

    .glass { background:rgba(249,115,22,0.05);backdrop-filter:blur(16px);border:1px solid rgba(249,115,22,0.12); }

    .skip-btn {
      background:linear-gradient(135deg, #f97316, #ec4899);
      transition:all .2s;
      box-shadow: 0 4px 15px rgba(249,115,22,0.3);
    }
    .skip-btn:hover {
      transform:scale(1.03);
      box-shadow: 0 6px 25px rgba(249,115,22,0.5);
    }

    #progress-bar { transition:width 1s linear; }
  </style>
</head>
<body class="text-white flex flex-col min-h-screen relative overflow-hidden">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Top progress bar -->
  <div class="fixed top-0 left-0 right-0 h-1 bg-white/5 z-50">
    <div id="progress-bar" class="h-full w-full rounded-full" style="background:linear-gradient(90deg,#f97316,#ec4899)"></div>
  </div>

  <div class="flex-1 flex items-center justify-center px-4 relative z-10">
    <div class="text-center fade-up max-w-sm w-full">

      <!-- Emoji / Poster icon -->
      <div id="ch-emoji" class="w-24 h-24 rounded-2xl mx-auto mb-6 flex items-center justify-center text-5xl glass shadow-2xl overflow-hidden">🔗</div>

      <!-- Name -->
      <h2 class="text-2xl font-bold mb-1" id="ch-name">Opening Channel</h2>
      <p class="text-gray-500 text-sm mb-8">You will be redirected to Telegram</p>

      <!-- Circular timer -->
      <div class="relative w-36 h-36 mx-auto mb-8">
        <svg class="w-full h-full" viewBox="0 0 100 100">
          <circle class="ring-bg"   cx="50" cy="50" r="44" fill="none" stroke-width="6"/>
          <circle class="ring-fill" cx="50" cy="50" r="44" fill="none" stroke-width="6"
            id="ring" stroke-dasharray="276.46" stroke-dashoffset="0"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="num" class="text-5xl font-black">7</span>
          <span class="text-xs text-gray-500 mt-1">seconds</span>
        </div>
      </div>

      <!-- Status -->
      <p class="text-gray-400 text-sm mb-6">
        Opening Telegram in <span id="sec" class="text-white font-semibold">7</span> seconds...
      </p>

      <!-- Open Now -->
      <button onclick="goNow()" class="skip-btn text-white font-semibold px-8 py-3 rounded-2xl text-sm w-full mb-3">
        Open Now ➜
      </button>

      <!-- Back -->
      <a href="/" class="text-gray-600 text-xs hover:text-gray-400 transition-colors block">← Go back to channels</a>
    </div>
  </div>

  <div class="text-center pb-6 text-gray-700 text-xs relative z-10">
    Redirecting safely · My Telegram Channels
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const link   = params.get("url")   || "";
  const name   = params.get("name")  || "Channel";
  const emoji  = params.get("emoji") || "🔗";
  const img    = params.get("img")   || "";

  // Show poster image if available, else emoji
  const iconEl = document.getElementById("ch-emoji");
  if (img) {
    iconEl.innerHTML = `<img src="${img}" alt="${name}"
      style="width:100%;height:100%;object-fit:cover;border-radius:14px;"
      onerror="this.parentElement.textContent='${emoji}'"/>`;
  } else {
    iconEl.textContent = emoji;
  }

  document.getElementById("ch-name").textContent  = name;
  document.title = "Joining " + name + "...";

  if (!link) { window.location.href = "/"; }

  const TOTAL = 7, CIRC = 276.46;
  let count = TOTAL;
  const ring = document.getElementById("ring");
  const numEl = document.getElementById("num");
  const secEl = document.getElementById("sec");
  const bar   = document.getElementById("progress-bar");

  const timer = setInterval(() => {
    count--;
    numEl.classList.remove("num-pop");
    void numEl.offsetWidth;
    numEl.classList.add("num-pop");
    numEl.textContent = count;
    secEl.textContent = count;
    ring.style.strokeDashoffset = CIRC * (1 - count / TOTAL);
    bar.style.width = (count / TOTAL * 100) + "%";
    if (count <= 0) { clearInterval(timer); numEl.textContent = "🚀"; setTimeout(goNow, 300); }
  }, 1000);

  function goNow() {
    clearInterval(timer);
    window.location.href = link;
  }
</script>
</body>
</html>
