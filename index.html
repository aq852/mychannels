<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Telegram Channels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card { transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 0 24px rgba(42,171,238,.25); }
    .hidden-card { display: none !important; }
  </style>
</head>
<body class="min-h-screen text-white">

  <!-- HEADER -->
  <div class="text-center py-12 px-4">
    <p class="text-blue-400 text-sm mb-3">✈️ Telegram Channel Directory</p>
    <h1 class="text-4xl sm:text-5xl font-bold mb-3">
      Join Our <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Channels</span>
    </h1>
    <p class="text-gray-400 max-w-md mx-auto">Curated Telegram channels. Click Join to connect — your privacy is protected.</p>
  </div>

  <!-- SEARCH + FILTER -->
  <div class="max-w-5xl mx-auto px-4 mb-6">
    <input id="search" type="text" placeholder="🔍  Search channels..."
      oninput="filter()"
      class="w-full px-4 py-3 rounded-2xl glass text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"/>
  </div>

  <div class="max-w-5xl mx-auto px-4 mb-8 flex gap-2 flex-wrap justify-center" id="pills">
    <!-- Pills generated by JS below -->
  </div>

  <!-- CHANNEL GRID -->
  <div class="max-w-5xl mx-auto px-4 pb-16">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="grid">
      <!-- Cards generated by JS below -->
    </div>
    <div id="empty" class="hidden text-center py-20 text-gray-500">No channels found.</div>
  </div>

  <footer class="text-center text-gray-600 text-sm pb-8">
    © 2025 My Telegram Channels · Secure &amp; Verified Links
  </footer>

<script>
// ═══════════════════════════════════════════════════
//  ADD YOUR CHANNELS HERE — only public info, NO links
//  Links are stored safely in Vercel Environment Variables
// ═══════════════════════════════════════════════════
const channels = [
  {
    id:       "tech_updates",       // must match env var: CHANNEL_LINK_TECH_UPDATES
    name:     "Tech Updates Daily",
    desc:     "Latest news from the world of technology, AI, and software development.",
    category: "Tech",
    members:  "15.2K",
    emoji:    "💻",
    tags:     ["AI", "Dev", "Gadgets"],
    featured: true,
  },
  {
    id:       "crypto_signals",
    name:     "Crypto Signals Pro",
    desc:     "Daily crypto signals, market analysis, and trading tips from experts.",
    category: "Business",
    members:  "8.7K",
    emoji:    "📈",
    tags:     ["Crypto", "Trading", "Finance"],
    featured: true,
  },
  {
    id:       "movie_zone",
    name:     "Movie Zone",
    desc:     "Reviews and discussions about the latest movies and series.",
    category: "Entertainment",
    members:  "22.1K",
    emoji:    "🎬",
    tags:     ["Movies", "Series"],
    featured: false,
  },
  {
    id:       "study_hub",
    name:     "Study Hub",
    desc:     "Free study materials, notes, and resources for students.",
    category: "Education",
    members:  "31.5K",
    emoji:    "📚",
    tags:     ["Study", "Notes", "Exams"],
    featured: false,
  },
  {
    id:       "news_flash",
    name:     "News Flash",
    desc:     "Breaking news and important updates from around the world, 24/7.",
    category: "News",
    members:  "45.3K",
    emoji:    "📰",
    tags:     ["Breaking", "World"],
    featured: false,
  },
  {
    id:       "startup_hub",
    name:     "Startup Hub",
    desc:     "For entrepreneurs and founders — funding news, tips, and community.",
    category: "Business",
    members:  "5.9K",
    emoji:    "🚀",
    tags:     ["Startup", "Founder"],
    featured: false,
  },
];

// ═══════════════════════════════════════════════
//  Category pill colors
// ═══════════════════════════════════════════════
const catColor = {
  Tech:          "bg-blue-900/60 text-blue-300",
  Business:      "bg-yellow-900/60 text-yellow-300",
  Entertainment: "bg-purple-900/60 text-purple-300",
  Education:     "bg-green-900/60 text-green-300",
  News:          "bg-red-900/60 text-red-300",
};

// ═══════════════════════════════════════════════
//  Build category pills
// ═══════════════════════════════════════════════
let activeCategory = "All";
const cats = ["All", ...new Set(channels.map(c => c.category))];
const pillsEl = document.getElementById("pills");

cats.forEach(cat => {
  const btn = document.createElement("button");
  btn.textContent = cat;
  btn.dataset.cat = cat;
  btn.onclick = () => setCategory(cat);
  btn.className = "cat-pill px-4 py-1.5 rounded-full text-sm font-medium border transition-all glass text-gray-400 border-white/10";
  pillsEl.appendChild(btn);
});

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll(".cat-pill").forEach(b => {
    const on = b.dataset.cat === cat;
    b.className = `cat-pill px-4 py-1.5 rounded-full text-sm font-medium border transition-all ${
      on ? "bg-blue-500 text-white border-blue-500" : "glass text-gray-400 border-white/10"
    }`;
  });
  filter();
}
setCategory("All"); // activate All pill on load

// ═══════════════════════════════════════════════
//  Render cards
// ═══════════════════════════════════════════════
const grid = document.getElementById("grid");

channels.forEach(ch => {
  const card = document.createElement("div");
  card.className = "channel-card card glass rounded-2xl p-5 flex flex-col gap-3";
  card.dataset.name     = ch.name.toLowerCase();
  card.dataset.desc     = ch.desc.toLowerCase();
  card.dataset.tags     = ch.tags.join(" ").toLowerCase();
  card.dataset.category = ch.category;

  card.innerHTML = `
    <div class="flex items-start gap-3">
      <div class="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center text-2xl border border-white/10 flex-shrink-0">
        ${ch.emoji}
      </div>
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-semibold text-white">${ch.name}</span>
          ${ch.featured ? '<span class="text-xs bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full">⭐ Featured</span>' : ""}
        </div>
        <span class="text-xs px-2 py-0.5 rounded-full mt-1 inline-block ${catColor[ch.category] || 'bg-gray-800 text-gray-300'}">${ch.category}</span>
      </div>
    </div>
    <p class="text-gray-400 text-sm leading-relaxed">${ch.desc}</p>
    <div class="flex gap-1.5 flex-wrap">
      ${ch.tags.map(t => `<span class="text-xs bg-white/5 text-gray-400 border border-white/10 px-2 py-0.5 rounded-full">#${t}</span>`).join("")}
    </div>
    <div class="flex items-center justify-between pt-2 border-t border-white/10 mt-auto">
      <span class="text-sm text-gray-400">👥 ${ch.members}</span>
      <button
        id="btn-${ch.id}"
        onclick="joinChannel('${ch.id}')"
        class="bg-blue-500 hover:bg-blue-600 active:scale-95 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-all"
      >🔗 Join</button>
    </div>
  `;
  grid.appendChild(card);
});

// ═══════════════════════════════════════════════
//  Filter logic
// ═══════════════════════════════════════════════
function filter() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll(".channel-card").forEach(card => {
    const matchSearch = !q || card.dataset.name.includes(q) || card.dataset.desc.includes(q) || card.dataset.tags.includes(q) || card.dataset.category.toLowerCase().includes(q);
    const matchCat    = activeCategory === "All" || card.dataset.category === activeCategory;
    if (matchSearch && matchCat) { card.classList.remove("hidden-card"); visible++; }
    else card.classList.add("hidden-card");
  });
  document.getElementById("empty").classList.toggle("hidden", visible > 0);
}

// ═══════════════════════════════════════════════
//  Join — calls /api/join?id=xxx
//  Actual Telegram link NEVER exposed to browser
// ═══════════════════════════════════════════════
function joinChannel(id) {
  const btn = document.getElementById("btn-" + id);
  btn.disabled = true;
  btn.textContent = "⏳ Opening…";
  window.open(`/api/join?id=${id}`, "_blank");
  setTimeout(() => {
    btn.textContent = "✅ Opened!";
    btn.classList.replace("bg-blue-500", "bg-green-600");
    setTimeout(() => {
      btn.textContent = "🔗 Join";
      btn.disabled = false;
      btn.classList.replace("bg-green-600", "bg-blue-500");
    }, 3000);
  }, 700);
}
</script>
</body>
</html>
