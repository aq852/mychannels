<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Telegram Channels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); }
    .card { transition: transform .25s, box-shadow .25s; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 8px 32px rgba(42,171,238,0.25); }
    .poster { width: 100%; height: 180px; object-fit: cover; }
    .poster-fallback { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
    .join-btn { transition: transform .15s, background .15s; }
    .join-btn:hover { transform: scale(1.05); }
    .join-btn:active { transform: scale(.95); }
  </style>
</head>
<body class="text-white">

  <!-- HEADER -->
  <div class="text-center py-12 px-4">
    <div class="inline-block glass px-4 py-2 rounded-full text-blue-400 text-sm mb-5">✈️ Telegram Channel Directory</div>
    <h1 class="text-4xl sm:text-5xl font-bold mb-3">
      Our <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Telegram Channels</span>
    </h1>
    <p class="text-gray-400 max-w-sm mx-auto text-sm">Join our channels and stay updated. Click any card to join!</p>
  </div>

  <!-- SEARCH -->
  <div class="max-w-5xl mx-auto px-4 mb-10">
    <div class="relative max-w-md mx-auto">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
      <input id="search" type="text" placeholder="Search channels..." oninput="filterCards()"
        class="w-full pl-10 pr-4 py-3 rounded-2xl glass text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"/>
    </div>
  </div>

  <!-- CHANNEL GRID -->
  <div class="max-w-5xl mx-auto px-4 pb-20">
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- cards injected by JS -->
    </div>
    <div id="empty" class="hidden text-center py-20 text-gray-500">No channels found.</div>
  </div>

  <!-- FOOTER -->
  <footer class="text-center text-gray-600 text-sm pb-8">
    © 2025 My Telegram Channels
  </footer>

<script>
// ═══════════════════════════════════════════════════════
//  ✏️  ADD / EDIT YOUR CHANNELS HERE
//
//  image: put any image URL, or leave "" for emoji icon
//  emoji: shown if no image is provided
//  link:  your actual Telegram invite link
// ═══════════════════════════════════════════════════════
const channels = [
  {
    name:    "Movie Update",
    desc:    "Latest Update which we upload on our db.",
    emoji:   "🎬",
    image:   "https://i.ibb.co/fVxKMFFr/photo-2026-10-19-02-19-52-7698198031450577920.jpg",   // 👈 paste a poster image URL here, e.g. "https://i.imgur.com/xxx.jpg"
    members: "Join Now",
    link:    "https://t.me/+IJZ4m49jRSI5YzYx",
  },

  // ── Add more channels below like this: ─────────────
  // {
  //   name:    "Channel Name",
  //   desc:    "Short description here.",
  //   emoji:   "📢",
  //   image:   "",       // image URL or ""
  //   members: "5K",
  //   link:    "https://t.me/+xxxxxx",
  // },
];

// ═══════════════════════════════════════════════════════
//  Build cards
// ═══════════════════════════════════════════════════════
const grid  = document.getElementById("grid");
const empty = document.getElementById("empty");

// Gradient backgrounds for fallback (no image)
const gradients = [
  "from-blue-600 to-purple-600",
  "from-pink-600 to-orange-500",
  "from-green-600 to-teal-500",
  "from-yellow-500 to-red-500",
  "from-indigo-600 to-blue-400",
  "from-purple-600 to-pink-500",
];

channels.forEach((ch, i) => {
  const card = document.createElement("div");
  card.className = "channel-card card glass rounded-2xl overflow-hidden flex flex-col cursor-pointer";
  card.dataset.name = ch.name.toLowerCase();
  card.dataset.desc = (ch.desc || "").toLowerCase();
  card.onclick = () => window.open(ch.link, "_blank");

  const grad = gradients[i % gradients.length];

  const topSection = ch.image
    ? `<img src="${ch.image}" alt="${ch.name}" class="poster" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
       <div class="poster-fallback bg-gradient-to-br ${grad}" style="display:none">${ch.emoji}</div>`
    : `<div class="poster-fallback bg-gradient-to-br ${grad}">${ch.emoji}</div>`;

  card.innerHTML = `
    ${topSection}
    <div class="p-4 flex flex-col gap-3 flex-1">
      <div>
        <h3 class="text-white font-bold text-lg leading-tight">${ch.name}</h3>
        ${ch.desc ? `<p class="text-gray-400 text-sm mt-1 leading-relaxed">${ch.desc}</p>` : ""}
      </div>
      <div class="flex items-center justify-between mt-auto pt-3 border-t border-white/10">
        <span class="text-gray-400 text-xs flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/></svg>
          ${ch.members}
        </span>
        <button
          onclick="event.stopPropagation(); window.open('${ch.link}','_blank')"
          class="join-btn bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold px-5 py-2 rounded-xl flex items-center gap-1.5"
        >
          Join ➜
        </button>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

// ═══════════════════════════════════════════════════════
//  Search filter
// ═══════════════════════════════════════════════════════
function filterCards() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll(".channel-card").forEach(card => {
    const match = !q || card.dataset.name.includes(q) || card.dataset.desc.includes(q);
    card.style.display = match ? "" : "none";
    if (match) visible++;
  });
  empty.classList.toggle("hidden", visible > 0);
}
</script>
</body>
</html>
