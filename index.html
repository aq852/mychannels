<!DOCTYPE html>
<html lang="en" data-theme="cosmos">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Telegram Channels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

    /* ── THEME VARIABLES ─────────────────────── */
    :root {
      --bg:        #0d0d1a;
      --blob1:     #4f46e5;
      --blob2:     #2AABEE;
      --blob3:     #a855f7;
      --accent:    #2AABEE;
      --accent2:   #6c3ff7;
      --card-bg:   rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --text-sub:  #9ca3af;
      --btn-grad:  linear-gradient(135deg, #2AABEE, #1c6fd4);
      --glow:      rgba(42,171,238,0.25);
      --title-grad: from-blue-400 via-purple-400 to-pink-400;
    }

    [data-theme="neon"] {
      --bg:        #050510;
      --blob1:     #00ff88;
      --blob2:     #00d4ff;
      --blob3:     #ff00aa;
      --accent:    #00ff88;
      --accent2:   #00d4ff;
      --card-bg:   rgba(0,255,136,0.04);
      --card-border: rgba(0,255,136,0.12);
      --btn-grad:  linear-gradient(135deg, #00ff88, #00d4ff);
      --glow:      rgba(0,255,136,0.2);
    }

    [data-theme="sunset"] {
      --bg:        #0f0800;
      --blob1:     #f97316;
      --blob2:     #ec4899;
      --blob3:     #eab308;
      --accent:    #f97316;
      --accent2:   #ec4899;
      --card-bg:   rgba(249,115,22,0.05);
      --card-border: rgba(249,115,22,0.12);
      --btn-grad:  linear-gradient(135deg, #f97316, #ec4899);
      --glow:      rgba(249,115,22,0.25);
    }

    [data-theme="ocean"] {
      --bg:        #020d18;
      --blob1:     #0ea5e9;
      --blob2:     #06b6d4;
      --blob3:     #6366f1;
      --accent:    #0ea5e9;
      --accent2:   #06b6d4;
      --card-bg:   rgba(14,165,233,0.05);
      --card-border: rgba(14,165,233,0.12);
      --btn-grad:  linear-gradient(135deg, #0ea5e9, #06b6d4);
      --glow:      rgba(14,165,233,0.25);
    }

    [data-theme="galaxy"] {
      --bg:        #0a0015;
      --blob1:     #9333ea;
      --blob2:     #ec4899;
      --blob3:     #6366f1;
      --accent:    #a855f7;
      --accent2:   #ec4899;
      --card-bg:   rgba(168,85,247,0.05);
      --card-border: rgba(168,85,247,0.12);
      --btn-grad:  linear-gradient(135deg, #9333ea, #ec4899);
      --glow:      rgba(168,85,247,0.25);
    }

    body { background: var(--bg); min-height: 100vh; transition: background .5s; }

    /* ── BLOBS ───────────────────────────────── */
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(90px); opacity: 0.15;
      animation: float 10s ease-in-out infinite;
      pointer-events: none; z-index: 0;
      transition: background .5s;
    }
    .blob-1 { width:550px; height:550px; background:var(--blob1); top:-120px; left:-120px; }
    .blob-2 { width:450px; height:450px; background:var(--blob2); bottom:-100px; right:-100px; animation-delay:4s; }
    .blob-3 { width:350px; height:350px; background:var(--blob3); top:45%; left:38%; animation-delay:7s; }
    @keyframes float {
      0%,100% { transform:translate(0,0) scale(1); }
      50%      { transform:translate(25px,-25px) scale(1.04); }
    }

    /* ── MARQUEE TICKER ──────────────────────── */
    .ticker-wrap {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      overflow: hidden; padding: 10px 0;
    }
    .ticker {
      display: flex; gap: 60px;
      animation: ticker 25s linear infinite;
      white-space: nowrap;
    }
    .ticker:hover { animation-play-state: paused; }
    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 500;
    }
    .ticker-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }

    /* ── GLASS ───────────────────────────────── */
    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      transition: background .5s, border-color .5s;
    }

    /* ── CHANNEL CARD ────────────────────────── */
    .channel-card {
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, border-color .3s;
    }
    .channel-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 20px 60px var(--glow);
      border-color: var(--accent) !important;
    }
    .poster-wrap { overflow:hidden; border-radius:16px 16px 0 0; }
    .poster-img  { width:100%; height:200px; object-fit:cover; transition:transform .4s; }
    .channel-card:hover .poster-img { transform:scale(1.06); }
    .poster-fallback { width:100%; height:200px; display:flex; align-items:center; justify-content:center; font-size:70px; border-radius:16px 16px 0 0; }

    /* ── JOIN BUTTON ─────────────────────────── */
    .join-btn {
      background: var(--btn-grad);
      transition: all .2s;
      box-shadow: 0 4px 15px var(--glow);
    }
    .join-btn:hover { transform:scale(1.06); box-shadow:0 6px 25px var(--glow); }
    .join-btn:active { transform:scale(.96); }

    /* ── COPY BUTTON ─────────────────────────── */
    .copy-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all .2s;
    }
    .copy-btn:hover { background:rgba(255,255,255,0.12); }

    /* ── THEME SWITCHER ──────────────────────── */
    .theme-dot {
      width:22px; height:22px; border-radius:50%; cursor:pointer;
      transition: transform .2s, box-shadow .2s;
      border: 2px solid transparent;
    }
    .theme-dot:hover { transform:scale(1.2); }
    .theme-dot.active { border-color:white; transform:scale(1.15); box-shadow:0 0 10px rgba(255,255,255,0.4); }

    /* ── BADGES ──────────────────────────────── */
    .badge-new {
      background:linear-gradient(135deg,#ef4444,#f97316);
      font-size:10px; font-weight:700; letter-spacing:.5px;
      padding:2px 7px; border-radius:99px; color:white;
      animation: badgePop .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes badgePop { from{transform:scale(0)} to{transform:scale(1)} }

    .live-badge {
      background: linear-gradient(135deg,rgba(var(--accent),0.15),rgba(42,171,238,0.1));
      border: 1px solid rgba(42,171,238,0.25);
    }

    /* ── PULSE ───────────────────────────────── */
    .pulse-dot { width:8px;height:8px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite; }
    @keyframes pulse {
      0%,100%{ box-shadow:0 0 0 0 rgba(34,197,94,.5); }
      50%    { box-shadow:0 0 0 7px rgba(34,197,94,0); }
    }

    /* ── CARD ENTER ──────────────────────────── */
    @keyframes cardIn { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
    .card-anim { animation:cardIn .5s ease both; }

    /* Scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;opacity:.5}
  </style>
</head>

<body class="text-white relative overflow-x-hidden">

  <!-- Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="relative z-10">

    <!-- ── MARQUEE TICKER ──────────────────────── -->
    <div class="ticker-wrap" id="ticker-bar">
      <div class="ticker" id="ticker">
        <!-- filled by JS -->
      </div>
    </div>

    <!-- ── HEADER ──────────────────────────────── -->
    <div class="text-center pt-14 pb-10 px-4">

      <!-- Live badge -->
      <div class="inline-flex items-center gap-2 glass px-4 py-1.5 rounded-full text-sm mb-6" style="color:var(--accent)">
        <div class="pulse-dot"></div>
        Live Telegram Channels
      </div>

      <h1 class="text-5xl sm:text-6xl font-extrabold mb-4 leading-none tracking-tight">
        Our <br/>
        <span class="text-transparent bg-clip-text" id="title-grad"
          style="background-image:linear-gradient(135deg, var(--accent), var(--accent2), #ec4899)">
          Telegram Channels
        </span>
      </h1>

      <p class="text-gray-400 text-base max-w-xs mx-auto leading-relaxed mb-8">
        Premium content & daily updates.<br/>
        Tap <strong class="text-white">Join</strong> to become part of our community.
      </p>

      <!-- Stats -->
      <div class="flex justify-center gap-4 mb-10">
        <div class="glass px-5 py-3 rounded-2xl text-center">
          <div class="text-xl font-bold" id="total-count" style="color:var(--accent)">0</div>
          <div class="text-xs text-gray-500 mt-0.5">Channels</div>
        </div>
        <div class="glass px-5 py-3 rounded-2xl text-center">
          <div class="text-xl font-bold" style="color:var(--accent)">Free</div>
          <div class="text-xs text-gray-500 mt-0.5">To Join</div>
        </div>
        <div class="glass px-5 py-3 rounded-2xl text-center">
          <div class="text-xl font-bold" style="color:var(--accent)">24/7</div>
          <div class="text-xs text-gray-500 mt-0.5">Updates</div>
        </div>
      </div>

      <!-- ── THEME SWITCHER ──────────────────── -->
      <div class="flex items-center justify-center gap-3 mb-2">
        <span class="text-xs text-gray-600 mr-1">Theme:</span>
        <button class="theme-dot active" data-theme="cosmos"  style="background:linear-gradient(135deg,#4f46e5,#2AABEE)" title="Cosmos"  onclick="setTheme('cosmos',this)"></button>
        <button class="theme-dot"        data-theme="neon"    style="background:linear-gradient(135deg,#00ff88,#00d4ff)" title="Neon"    onclick="setTheme('neon',this)"></button>
        <button class="theme-dot"        data-theme="sunset"  style="background:linear-gradient(135deg,#f97316,#ec4899)" title="Sunset"  onclick="setTheme('sunset',this)"></button>
        <button class="theme-dot"        data-theme="ocean"   style="background:linear-gradient(135deg,#0ea5e9,#06b6d4)" title="Ocean"   onclick="setTheme('ocean',this)"></button>
        <button class="theme-dot"        data-theme="galaxy"  style="background:linear-gradient(135deg,#9333ea,#ec4899)" title="Galaxy"  onclick="setTheme('galaxy',this)"></button>
      </div>
      <p class="text-xs text-gray-700">Pick a theme 👆</p>
    </div>

    <!-- ── CHANNEL GRID ────────────────────────── -->
    <div class="max-w-5xl mx-auto px-4 pb-24">
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- ── FOOTER ──────────────────────────────── -->
    <footer class="text-center pb-10 px-4">
      <div class="glass inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-gray-500 text-xs">
        <svg class="w-3.5 h-3.5" style="color:var(--accent)" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
        </svg>
        © 2025 My Telegram Channels · Updated Daily
      </div>
    </footer>

  </div>

<script>
// ═══════════════════════════════════════════
//  ✏️  ADD YOUR CHANNELS HERE
//  isNew: true  →  shows "NEW" badge
//  members: "10K" → shows subscriber count
// ═══════════════════════════════════════════
const channels = [
  {
    name:    "Movie Update",
    desc:    "Latest movie releases, trailers & film news uploaded daily.",
    emoji:   "🎬",
    image:   "https://i.ibb.co/fVxKMFFr/photo-2026-10-19-02-19-52-7698198031450577920.jpg",   // 👈 paste poster image URL here
    members: "307",
    link:    "https://t.me/+IJZ4m49jRSI5YzYx",
    isNew:   false,
  },

  // Add more:
  // {
  //   name:    "My Channel",
  //   desc:    "Description...",
  //   emoji:   "📢",
  //   image:   "",
  //   members: "1.2K",
  //   link:    "https://t.me/+xxxxxx",
  //   isNew:   true,
  // },
];

// ═══════════════════════════════════════════
//  Fallback gradients
// ═══════════════════════════════════════════
const grads = [
  ["#1e3a8a","#7c3aed"],
  ["#9d174d","#c2410c"],
  ["#065f46","#0e7490"],
  ["#92400e","#dc2626"],
  ["#4c1d95","#be185d"],
  ["#1e40af","#0891b2"],
];

// ═══════════════════════════════════════════
//  Build ticker
// ═══════════════════════════════════════════
const ticker = document.getElementById("ticker");
// Duplicate for seamless loop
const items = [...channels, ...channels].map(ch =>
  `<span class="ticker-item"><span class="ticker-dot"></span>${ch.emoji} ${ch.name}</span>`
).join("");
ticker.innerHTML = items;

// ═══════════════════════════════════════════
//  Build cards
// ═══════════════════════════════════════════
const grid = document.getElementById("grid");
document.getElementById("total-count").textContent = channels.length;

channels.forEach((ch, i) => {
  const [g1, g2] = grads[i % grads.length];
  const card = document.createElement("div");
  card.className = "channel-card card-anim glass rounded-2xl overflow-hidden flex flex-col";
  card.style.animationDelay = `${i * 100}ms`;

  const poster = ch.image
    ? `<div class="poster-wrap">
         <img src="${ch.image}" alt="${ch.name}" class="poster-img"
           onerror="this.parentElement.innerHTML='<div class=&quot;poster-fallback&quot; style=&quot;background:linear-gradient(135deg,${g1},${g2})&quot;>${ch.emoji}</div>'"/>
       </div>`
    : `<div class="poster-fallback" style="background:linear-gradient(135deg,${g1},${g2})">${ch.emoji}</div>`;

  card.innerHTML = `
    ${poster}
    <div class="p-5 flex flex-col gap-3 flex-1">
      <div>
        <div class="flex items-center gap-2 flex-wrap mb-1">
          <h3 class="text-white font-bold text-lg leading-tight">${ch.name}</h3>
          ${ch.isNew ? '<span class="badge-new">NEW</span>' : ""}
        </div>
        ${ch.desc ? `<p class="text-gray-400 text-sm leading-relaxed">${ch.desc}</p>` : ""}
      </div>

      <!-- Member count -->
      ${ch.members ? `
      <div class="flex items-center gap-1.5 text-xs" style="color:var(--accent)">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
        </svg>
        <span class="font-semibold">${ch.members}</span> <span class="text-gray-600">subscribers</span>
      </div>` : ""}

      <!-- Actions -->
      <div class="flex gap-2 mt-auto pt-3 border-t" style="border-color:rgba(255,255,255,0.07)">
        <!-- Copy link -->
        <button id="copy-${i}" onclick="copyLink(${i},'${ch.link}')"
          class="copy-btn text-gray-400 text-xs font-medium px-3 py-2 rounded-xl flex items-center gap-1.5 hover:text-white">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
          Copy
        </button>

        <!-- Join -->
        <button id="btn-${i}" onclick="joinCh(${i},'${ch.link}')"
          class="join-btn text-white text-sm font-bold px-5 py-2 rounded-xl flex-1">
          Join ➜
        </button>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

// ═══════════════════════════════════════════
//  Join
// ═══════════════════════════════════════════
function joinCh(i, link) {
  const btn = document.getElementById("btn-" + i);
  btn.disabled = true;
  btn.textContent = "Opening…";
  btn.style.background = "rgba(255,255,255,0.1)";
  window.open(link, "_blank");
  setTimeout(() => {
    btn.textContent = "✅ Joined!";
    btn.style.background = "linear-gradient(135deg,#16a34a,#15803d)";
    setTimeout(() => {
      btn.textContent = "Join ➜";
      btn.disabled = false;
      btn.style.background = "";
    }, 3000);
  }, 700);
}

// ═══════════════════════════════════════════
//  Copy link
// ═══════════════════════════════════════════
function copyLink(i, link) {
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.getElementById("copy-" + i);
    btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copied!`;
    btn.style.color = "#22c55e";
    setTimeout(() => {
      btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg> Copy`;
      btn.style.color = "";
    }, 2000);
  });
}

// ═══════════════════════════════════════════
//  Theme switcher
// ═══════════════════════════════════════════
function setTheme(theme, el) {
  document.documentElement.setAttribute("data-theme", theme);
  document.querySelectorAll(".theme-dot").forEach(d => d.classList.remove("active"));
  el.classList.add("active");
  localStorage.setItem("tg-theme", theme);
}

// Restore saved theme
const saved = localStorage.getItem("tg-theme");
if (saved) {
  document.documentElement.setAttribute("data-theme", saved);
  const dot = document.querySelector(`[data-theme="${saved}"].theme-dot`);
  if (dot) {
    document.querySelectorAll(".theme-dot").forEach(d => d.classList.remove("active"));
    dot.classList.add("active");
  }
}
</script>
</body>
</html>
