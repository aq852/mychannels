<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Telegram Channels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      background: #0d0d1a;
      min-height: 100vh;
    }

    /* Animated background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; background: #4f46e5; top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: #2AABEE; bottom: -100px; right: -100px; animation-delay: 3s; }
    .blob-3 { width: 300px; height: 300px; background: #a855f7; top: 40%; left: 40%; animation-delay: 6s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(30px, -30px) scale(1.05); }
    }

    /* Glass card */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Channel card hover */
    .channel-card {
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, border-color .3s ease;
    }
    .channel-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 20px 60px rgba(42,171,238,0.2);
      border-color: rgba(42,171,238,0.4) !important;
    }

    /* Poster image */
    .poster-img {
      width: 100%; height: 200px;
      object-fit: cover;
      transition: transform .4s ease;
    }
    .channel-card:hover .poster-img { transform: scale(1.05); }

    .poster-wrap { overflow: hidden; border-radius: 16px 16px 0 0; }

    /* Join button */
    .join-btn {
      background: linear-gradient(135deg, #2AABEE, #1c93d4);
      transition: all .2s ease;
      box-shadow: 0 4px 15px rgba(42,171,238,0.3);
    }
    .join-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(42,171,238,0.5);
    }
    .join-btn:active { transform: scale(.97); }

    /* Search */
    .search-input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all .2s;
    }
    .search-input:focus {
      background: rgba(255,255,255,0.09);
      border-color: rgba(42,171,238,0.5);
      box-shadow: 0 0 0 3px rgba(42,171,238,0.1);
      outline: none;
    }

    /* Pulse dot */
    .pulse-dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50%       { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    }

    /* Badge pill */
    .badge {
      background: linear-gradient(135deg, rgba(42,171,238,0.15), rgba(108,99,255,0.15));
      border: 1px solid rgba(42,171,238,0.25);
    }

    /* Shimmer on poster fallback */
    .poster-fallback {
      width: 100%; height: 200px;
      display: flex; align-items: center; justify-content: center;
      font-size: 72px;
    }

    /* Card enter animation */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-anim { animation: cardIn .5s ease both; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0d0d1a; }
    ::-webkit-scrollbar-thumb { background: rgba(42,171,238,0.4); border-radius: 3px; }
  </style>
</head>

<body class="text-white relative overflow-x-hidden">

  <!-- Ambient blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="relative z-10">

    <!-- ── HERO HEADER ─────────────────────────────── -->
    <div class="text-center pt-16 pb-10 px-4">

      <!-- Live badge -->
      <div class="inline-flex items-center gap-2 badge px-4 py-1.5 rounded-full text-sm text-blue-300 font-medium mb-6">
        <div class="pulse-dot"></div>
        Live Channels
      </div>

      <h1 class="text-5xl sm:text-6xl font-extrabold mb-4 leading-none tracking-tight">
        Our
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">
          Telegram
        </span>
        <br/>Channels
      </h1>

      <p class="text-gray-400 text-base max-w-sm mx-auto leading-relaxed">
        Premium content, daily updates. <br/>
        Tap <strong class="text-white">Join</strong> and become part of the community.
      </p>

      <!-- Stats row -->
      <div class="flex justify-center gap-8 mt-8">
        <div class="glass px-5 py-3 rounded-2xl text-center">
          <div class="text-xl font-bold text-white" id="total-channels">0</div>
          <div class="text-xs text-gray-500 mt-0.5">Channels</div>
        </div>
        <div class="glass px-5 py-3 rounded-2xl text-center">
          <div class="text-xl font-bold text-white">Free</div>
          <div class="text-xs text-gray-500 mt-0.5">To Join</div>
        </div>
        <div class="glass px-5 py-3 rounded-2xl text-center">
          <div class="text-xl font-bold text-white">24/7</div>
          <div class="text-xs text-gray-500 mt-0.5">Updates</div>
        </div>
      </div>
    </div>

    <!-- ── SEARCH ──────────────────────────────────── -->
    <div class="max-w-lg mx-auto px-4 mb-12">
      <div class="relative">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="search" type="text" placeholder="Search channels..."
          oninput="filterCards()"
          class="search-input w-full pl-11 pr-10 py-3.5 rounded-2xl text-white placeholder-gray-600 text-sm"/>
        <button onclick="document.getElementById('search').value='';filterCards();"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-300 text-xs">✕</button>
      </div>
    </div>

    <!-- ── CHANNEL GRID ────────────────────────────── -->
    <div class="max-w-5xl mx-auto px-4 pb-24">
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center">
        <!-- cards injected by JS -->
      </div>
      <div id="empty" class="hidden text-center py-24">
        <div class="text-5xl mb-4">🔭</div>
        <p class="text-gray-500">No channels found. Try another search.</p>
      </div>
    </div>

    <!-- ── FOOTER ──────────────────────────────────── -->
    <footer class="text-center pb-10 px-4">
      <div class="glass inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-gray-500 text-xs">
        <svg class="w-3.5 h-3.5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
        </svg>
        © 2025 My Telegram Channels · Updated Daily
      </div>
    </footer>

  </div><!-- /z-10 -->

<script>
// ═══════════════════════════════════════════════
//  ✏️  YOUR CHANNELS — add name, link, image, desc
// ═══════════════════════════════════════════════
const channels = [
  {
    name:  "Movie Update",
    desc:  "Latest movie releases, trailers & film news uploaded daily.",
    emoji: "🎬",
    image: "https://i.ibb.co/fVxKMFFr/photo-2026-10-19-02-19-52-7698198031450577920.jpg",   // 👈 paste poster image URL here e.g. "https://i.imgur.com/xxx.jpg"
    link:  "https://t.me/+IJZ4m49jRSI5YzYx",
  },

  // Add more below:
  // {
  //   name:  "Channel Name",
  //   desc:  "Description here.",
  //   emoji: "📢",
  //   image: "",
  //   link:  "https://t.me/+xxxxxx",
  // },
];

// ═══════════════════════════════════════════════
//  Gradient fallbacks when no image given
// ═══════════════════════════════════════════════
const grads = [
  "from-blue-600 via-indigo-700 to-purple-700",
  "from-rose-600 via-pink-600 to-orange-500",
  "from-emerald-600 via-teal-600 to-cyan-600",
  "from-amber-500 via-orange-600 to-red-600",
  "from-violet-600 via-purple-600 to-pink-600",
  "from-sky-500 via-blue-600 to-indigo-700",
];

// ═══════════════════════════════════════════════
//  Render
// ═══════════════════════════════════════════════
const grid = document.getElementById("grid");
document.getElementById("total-channels").textContent = channels.length;

channels.forEach((ch, i) => {
  const card = document.createElement("div");
  card.className = "channel-card card-anim glass rounded-2xl overflow-hidden flex flex-col w-full max-w-sm";
  card.style.animationDelay = `${i * 100}ms`;
  card.dataset.name = ch.name.toLowerCase();
  card.dataset.desc = (ch.desc || "").toLowerCase();

  const poster = ch.image
    ? `<div class="poster-wrap">
         <img src="${ch.image}" alt="${ch.name}" class="poster-img"
           onerror="this.parentElement.innerHTML='<div class=\'poster-fallback bg-gradient-to-br ${grads[i % grads.length]}\'>${ch.emoji}</div>'"/>
       </div>`
    : `<div class="poster-fallback bg-gradient-to-br ${grads[i % grads.length]}" style="border-radius:16px 16px 0 0">${ch.emoji}</div>`;

  card.innerHTML = `
    ${poster}
    <div class="p-5 flex flex-col gap-3 flex-1">
      <div>
        <h3 class="text-white font-bold text-lg leading-tight">${ch.name}</h3>
        ${ch.desc ? `<p class="text-gray-400 text-sm mt-1.5 leading-relaxed">${ch.desc}</p>` : ""}
      </div>
      <div class="flex items-center justify-between mt-auto pt-3 border-t border-white/[0.07]">
        <div class="flex items-center gap-2 text-gray-500 text-xs">
          <svg class="w-3.5 h-3.5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
          </svg>
          Join Now
        </div>
        <button id="btn-${i}" onclick="joinCh(${i},'${ch.link}')"
          class="join-btn text-white text-sm font-semibold px-5 py-2 rounded-xl">
          Join ➜
        </button>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

// ═══════════════════════════════════════════════
//  Join handler
// ═══════════════════════════════════════════════
function joinCh(i, link) {
  const btn = document.getElementById("btn-" + i);
  btn.disabled = true;
  btn.textContent = "Opening…";
  btn.style.background = "rgba(255,255,255,0.1)";
  window.open(link, "_blank");
  setTimeout(() => {
    btn.textContent = "✅ Joined!";
    btn.style.background = "linear-gradient(135deg,#16a34a,#15803d)";
    setTimeout(() => {
      btn.textContent = "Join ➜";
      btn.disabled = false;
      btn.style.background = "";
    }, 3000);
  }, 700);
}

// ═══════════════════════════════════════════════
//  Search filter
// ═══════════════════════════════════════════════
function filterCards() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll(".channel-card").forEach(card => {
    const show = !q || card.dataset.name.includes(q) || card.dataset.desc.includes(q);
    card.style.display = show ? "" : "none";
    if (show) visible++;
  });
  document.getElementById("empty").classList.toggle("hidden", visible > 0);
}
</script>
</body>
</html>
